<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>
  
  <!-- Background Shape -->
  <rect width="400" height="400" fill="transparent" />
  
  <!-- Outer Ring (Gold) -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#goldGradient)" stroke-width="8" stroke-dasharray="10 15" opacity="0.8"/>
  
  <!-- Monogram M -->
  <path d="M100 320 L100 120 L150 120 L200 190 L250 120 L300 120 L300 320 L260 320 L260 180 L200 260 L140 180 L140 320 Z" fill="url(#goldGradient)" opacity="0.95"/>
</svg>
